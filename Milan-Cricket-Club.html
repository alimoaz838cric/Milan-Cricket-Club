<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket Scorer Live</title>
<meta name="theme-color" content="#1E6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scorer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#15202B; --muted:#5A6672; --line:#D5DBD3;
  --green:#1E6B3A; --green-soft:#DCEBDF; --on-green:#FFFFFF;
  --red:#B3261E; --red-soft:#F6DAD7; --amber:#9A5B00; --amber-soft:#F7E8CC;
  --shadow:0 -6px 24px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1511; --surface:#17211A; --ink:#E9F0EA; --muted:#97A69C; --line:#2A392F;
    --green:#3F9C5F; --green-soft:#1D3526; --on-green:#07130B;
    --red:#E2605A; --red-soft:#3A1E1C; --amber:#E3AE4B; --amber-soft:#3A2D13;
    --shadow:0 -6px 24px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#17211A; --ink:#E9F0EA; --muted:#97A69C; --line:#2A392F;
  --green:#3F9C5F; --green-soft:#1D3526; --on-green:#07130B;
  --red:#E2605A; --red-soft:#3A1E1C; --amber:#E3AE4B; --amber-soft:#3A2D13;
  --shadow:0 -6px 24px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:500 16px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 16px}
#pad{flex:none;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
#pad:empty{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:13px 4px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--green);border-top-color:var(--green)}
.num{font-family:'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* scoreboard */
.board{background:var(--green);color:var(--on-green);border-radius:14px;padding:14px 16px}
.board .who{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;opacity:.92}
.board .big{font-size:64px;line-height:1;font-weight:700;margin:6px 0 2px}
.board .big small{font-size:34px;opacity:.85}
.board .row{display:flex;gap:18px;flex-wrap:wrap;font-weight:600}
.board .chase{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.35);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.line{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.line+.line{border-top:1px solid var(--line)}
.line .nm{font-weight:600;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .nm i{font-style:normal;color:var(--green);margin-left:4px}
.line .st{font-size:26px;font-weight:700;white-space:nowrap}
.line .st small{font-size:17px;color:var(--muted);font-weight:600}
.lbl{color:var(--muted);font-size:14px;font-weight:600}
.over{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px}
.ball{min-width:34px;height:34px;padding:0 6px;border-radius:17px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px}
.ball.b4,.ball.b6{background:var(--green);color:var(--on-green);border-color:var(--green)}
.ball.w{background:var(--red);color:#fff;border-color:var(--red)}
.ball.x{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.banner{margin-top:10px;border-radius:12px;padding:12px 14px;background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber)}
.banner b{display:block;margin-bottom:6px}
.start{padding:28px 6px;text-align:center}
.start h1{font-size:30px;margin:0 0 6px;line-height:1.1}
.start p{color:var(--muted);margin:0 0 20px}

.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--green);color:var(--on-green);font-size:17px;min-height:50px}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.k{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;height:56px;font-weight:700;font-size:28px;
  font-family:'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,system-ui,sans-serif;touch-action:manipulation}
.k:active{transform:scale(.96)}
.k.g{background:var(--green);color:var(--on-green);border-color:var(--green)}
.k.r{background:var(--red);color:#fff;border-color:var(--red)}
.k.e{font-family:system-ui,sans-serif;font-size:17px;color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.k.s{font-family:system-ui,sans-serif;font-size:15px;color:var(--muted);height:44px}
.k.span2{grid-column:span 2}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:600px;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet .sub{color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:8px;margin:8px 0}
.grid .h{grid-column:1/-1;color:var(--muted);font-weight:600;font-size:14px;margin-top:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 8px;font-weight:600;min-height:50px;font-size:17px}
.opt:active{background:var(--green-soft)}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:20px;padding:9px 14px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{font-size:14px;min-height:140px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:20px;z-index:30;font-weight:600;max-width:90%}

/* scorecard tables */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:13px;color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--line)}
td{border-bottom:1px solid var(--line)}
td .how{display:block;color:var(--muted);font-size:13px}
.h3{margin:16px 0 6px;font-size:17px;font-weight:700;color:var(--green)}
.tot td{font-weight:700;border-bottom:0}
#bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-weight:600;font-size:15px;background:var(--surface);border-bottom:1px solid var(--line);min-height:44px}
#bar.me{background:var(--green);color:var(--on-green)}
#bar.off{background:var(--red);color:#fff}
#bar.none,#bar.stale{background:var(--amber-soft);color:var(--ink)}
#bar button{border:1.5px solid currentColor;background:transparent;border-radius:10px;padding:6px 12px;font-weight:700;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.chip.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.seg4{display:flex;gap:4px;flex:none}
.seg4 button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;min-width:46px;font-weight:700;font-size:14px}
.seg4 button.on[data-s=o]{background:var(--bg);color:var(--muted);border-color:var(--muted)}
.seg4 button.on[data-s=i]{background:var(--amber-soft);border-color:var(--amber)}
.seg4 button.on[data-s=a]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.seg4 button.on[data-s=b]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lg .nm{white-space:normal}
.fow{margin:0;padding:0;list-style:none;color:var(--ink)}
.fow li{padding:5px 0;border-bottom:1px solid var(--line)}
.field{margin:10px 0}
.field label{display:block;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{font-size:20px;font-weight:700;margin:6px 0 14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="view"></div>
  <div id="pad"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="score">Score</button>
    <button role="tab" data-tab="card">Scorecard</button>
    <button role="tab" data-tab="match">Match</button>
  </nav>
</div>

<script src="firebase-config.js"></script>
<script>
/* ========================================================================
   CLUB SETTINGS - the club admin edits this block ONCE (see SETUP-GUIDE.txt)
   Paste the values from Firebase: Project settings > Your apps > SDK setup.
   These values are safe to be public. The database rules protect the data.
   ======================================================================== */
/* The admin can either put the values in the separate file firebase-config.js (recommended),
   or paste them here. firebase-config.js wins if it exists. */
var FIREBASE_CONFIG = (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG) || {
  apiKey: "AIzaSyDpLkCyoe-pHX4OzBUZBXRgGRecygyYQIg",
  authDomain: "milan-cricket-club.firebaseapp.com",
  databaseURL: "https://milan-cricket-club-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "milan-cricket-club"
};
/* ============================ ENGINE START ============================ */
var M;
var CREDIT = ['bowled','caught','lbw','stumped','hitwicket'];
function same(a,b){ return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase(); }
function fmtOv(b){ return Math.floor(b/6) + '.' + (b%6); }
function newMatch(){
  return {v:1, setup:{title:'', a:'Team A', b:'Team B', batFirst:'a', overs:30, maxWkts:10, maxBowlerOvers:6, playersA:[], playersB:[], capA:'', vcA:'', wkA:'', twA:'', capB:'', vcB:'', wkB:'', twB:'', pinfo:[], tidA:'', tidB:'', poolTid:''}, inns:[]};
}
function teamName(side){ return side==='a' ? M.setup.a : M.setup.b; }
function battingSide(i){ return i===0 ? M.setup.batFirst : (M.setup.batFirst==='a' ? 'b' : 'a'); }
function batTeam(i){ return teamName(battingSide(i)); }
function bowlTeam(i){ return teamName(battingSide(i)==='a' ? 'b' : 'a'); }

function howOut(w, bowler){
  var f = w.fielder || '?';
  var fk = (w.fielder && typeof isKeeper === 'function' && isKeeper(w.fielder)) ? '\u2020' + f : f;
  switch(w.type){
    case 'bowled': return 'b ' + bowler;
    case 'caught': return same(f,bowler) ? 'c & b ' + bowler : 'c ' + fk + ' b ' + bowler;
    case 'lbw': return 'lbw b ' + bowler;
    case 'runout': return 'run out (' + f + ')';
    case 'stumped': return 'st ' + fk + ' b ' + bowler;
    case 'hitwicket': return 'hit wicket b ' + bowler;
    default: return w.desc || 'out';
  }
}

function describeBall(ev, w, outName, bw){
  var p = [];
  if(w){
    var s = 'OUT: ' + outName + ', ' + howOut(w, bw);
    if(ev.wd) s += ' (wide)'; if(ev.nb) s += ' (no ball)';
    if(ev.bat) s += ', ' + ev.bat + ' run' + (ev.bat===1?'':'s') + ' completed';
    return s;
  }
  if(ev.wd){ return 'Wide' + (ev.wd>1 ? ', ' + (ev.wd-1) + ' extra run' + (ev.wd-1===1?'':'s') : ''); }
  if(ev.nb){
    p.push('No ball');
    if(ev.bat) p.push(ev.bat + ' off the bat');
    if(ev.bye) p.push(ev.bye + ' bye' + (ev.bye===1?'':'s'));
    if(ev.lb) p.push(ev.lb + ' leg bye' + (ev.lb===1?'':'s'));
    return p.join(', ');
  }
  if(ev.kind==='bye') return ev.bye ? ev.bye + ' bye' + (ev.bye===1?'':'s') : 'No run (bye)';
  if(ev.kind==='lb') return ev.lb ? ev.lb + ' leg bye' + (ev.lb===1?'':'s') : 'No run (leg bye)';
  if(ev.bat===0) return 'Dot ball';
  if(ev.bat===4) return 'FOUR';
  if(ev.bat===6) return 'SIX';
  return ev.bat + ' run' + (ev.bat===1?'':'s');
}

function newPart(a, b){ return {a:a, b:b, ra:0, ba:0, rb:0, bb:0, ex:0}; }
function partRow(c, k, out){ return {k:k, a:c.a, b:c.b, ra:c.ra, ba:c.ba, rb:c.rb, bb:c.bb, ex:c.ex, runs:c.ra + c.rb + c.ex, balls:c.ba + c.bb, out:out, open:false}; }

/* Rebuild the full state of an innings from its event list. */
function replay(i){
  var S = M.setup, evs = (M.inns[i] || {events:[]}).events;
  var st = {started:false, score:0, wkts:0, balls:0, overs:0, lio:0, overRuns:0, striker:'', non:'', bowler:'',
    lastBowler:'', needBowler:false, batters:[], bowlers:[], extras:{wd:0,nb:0,b:0,lb:0}, fow:[], parts:[],
    lastFall:0, cur:null, thisOver:[], done:false, doneReason:'', target:0, events:evs, log:[]};
  if(i===1 && M.inns[0]) st.target = replay(0).score + 1;
  function getBat(n){ for(var k=0;k<st.batters.length;k++){ if(same(st.batters[k].name,n)) return st.batters[k]; } return null; }
  function addBat(n){ if(!n) return; if(!getBat(n)) st.batters.push({name:n,runs:0,balls:0,fours:0,sixes:0,how:'not out',out:false}); }
  function getBowl(n){
    for(var k=0;k<st.bowlers.length;k++){ if(same(st.bowlers[k].name,n)) return st.bowlers[k]; }
    var b = {name:n,balls:0,runs:0,wkts:0,maidens:0,wd:0,nb:0}; st.bowlers.push(b); return b;
  }
  function rr(n){ return (n===4||n===6) ? 0 : n; }
  for(var e=0;e<evs.length;e++){
    var ev = evs[e];
    if(st.done) break;
    if(ev.t==='start'){
      st.started = true; st.striker = ev.striker; st.non = ev.non; st.bowler = ev.bowler;
      addBat(ev.striker); addBat(ev.non); getBowl(ev.bowler);
      st.cur = newPart(ev.striker, ev.non);
    } else if(ev.t==='bowler'){
      if(st.needBowler){ st.needBowler = false; st.thisOver = []; }
      else if(st.lio>0){ st.overRuns += 100; }
      st.log.push({note:'New bowler: ' + ev.name});
      st.bowler = ev.name; getBowl(ev.name);
    } else if(ev.t==='swap'){
      var t0 = st.striker; st.striker = st.non; st.non = t0;
      st.log.push({note:'Strike swapped manually'});
    } else if(ev.t==='retire'){
      var outR = ev.out==='N' ? st.non : st.striker;
      var rb = getBat(outR); if(rb){ rb.how = 'retired hurt'; }
      st.log.push({note:outR + ' retired hurt, ' + (ev.newBatter||'?') + ' comes in'});
      if(st.cur) st.parts.push(partRow(st.cur, st.parts.length + 1, outR + ' retired hurt'));
      var remR = same(st.striker,outR) ? st.non : st.striker;
      if(ev.newBatter){ addBat(ev.newBatter); if(same(st.striker,outR)) st.striker = ev.newBatter; else st.non = ev.newBatter; st.cur = newPart(remR, ev.newBatter); }
    } else if(ev.t==='end'){
      st.done = true; st.doneReason = 'Innings closed';
    } else if(ev.t==='ball'){
      var legal = !ev.wd && !ev.nb, faced = !ev.wd;
      var total = ev.bat + ev.wd + ev.nb + ev.bye + ev.lb;
      var bRuns = ev.bat + ev.wd + ev.nb;
      var run = rr(ev.bat) + rr(ev.bye) + rr(ev.lb) + (ev.wd>1 ? rr(ev.wd-1) : 0);
      var w = ev.w || null;
      var crossed = (run%2===1);
      if(w && w.type==='caught') crossed = false;   /* caught: the incoming batter always takes strike */
      var s0 = st.striker, n0 = st.non, bw = st.bowler;
      var sb = getBat(s0); sb.runs += ev.bat; if(faced) sb.balls++; if(ev.bat===4) sb.fours++; if(ev.bat===6) sb.sixes++;
      var cp = st.cur;
      if(cp){
        if(same(s0, cp.a)){ cp.ra += ev.bat; if(faced) cp.ba++; } else { cp.rb += ev.bat; if(faced) cp.bb++; }
        cp.ex += ev.wd + ev.nb + ev.bye + ev.lb;
      }
      var bo = getBowl(bw); if(legal) bo.balls++; bo.runs += bRuns; bo.wd += ev.wd; bo.nb += ev.nb;
      st.extras.wd += ev.wd; st.extras.nb += ev.nb; st.extras.b += ev.bye; st.extras.lb += ev.lb;
      st.score += total; if(legal) st.balls++;
      var s = s0, n = n0, tmp;
      if(crossed){ tmp = s; s = n; n = tmp; }
      var overLbl = st.overs + '.' + (st.lio+1);
      if(w){
        var out = w.out==='N' ? n0 : s0;
        var ob = getBat(out); ob.how = howOut(w,bw); ob.out = true;
        st.wkts++;
        if(CREDIT.indexOf(w.type)>=0) bo.wkts++;
        st.fow.push({n:st.wkts, score:st.score, name:out, over:overLbl});
        if(st.cur) st.parts.push(partRow(st.cur, st.parts.length + 1, out + ' out')); st.lastFall = st.score;
        if(ev.newBatter){ addBat(ev.newBatter); if(same(s,out)) s = ev.newBatter; else n = ev.newBatter; st.cur = newPart(same(out,s0) ? n0 : s0, ev.newBatter); }
        else { if(same(s,out)) s = ''; else n = ''; st.cur = null; }
      }
      if(legal) st.lio++;
      st.overRuns += bRuns; st.thisOver.push(ev.label);
      var overEnded = false;
      if(st.lio>=6){
        overEnded = true;
        if(st.overRuns===0) bo.maidens++;
        tmp = s; s = n; n = tmp;
        st.overs++; st.lio = 0; st.overRuns = 0; st.lastBowler = bw;
      }
      st.striker = s; st.non = n;
      if(st.wkts >= S.maxWkts){ st.done = true; st.doneReason = 'All out'; }
      else if(st.overs >= S.overs){ st.done = true; st.doneReason = 'Overs complete'; }
      else if(i===1 && st.score >= st.target){ st.done = true; st.doneReason = 'Target reached'; }
      st.needBowler = overEnded && !st.done;
      st.log.push({over:overLbl, bowler:bw, striker:s0, label:ev.label, total:total, score:st.score, wkts:st.wkts,
        text:describeBall(ev, w, w ? (w.out==='N' ? n0 : s0) : '', bw)});
    }
  }
  return st;
}
function matchResult(){
  if(M.inns.length<2) return null;
  var a = replay(0), b = replay(1);
  if(!b.done) return null;
  if(b.score > a.score) return batTeam(1) + ' won by ' + (M.setup.maxWkts - b.wkts) + ' wicket' + ((M.setup.maxWkts-b.wkts)===1?'':'s');
  if(b.score < a.score) return batTeam(0) + ' won by ' + (a.score - b.score) + ' run' + ((a.score-b.score)===1?'':'s');
  return 'Match tied';
}
/* ============================= ENGINE END ============================= */

/* ------------------------------ storage ------------------------------ */
/* The match lives in the shared database. Only small personal settings are kept on the phone. */
var LS_NAME = 'cricket-live-name', LS_RECENT = 'cricket-live-recent', LS_ADMIN = 'cricket-admin-key', LS_PIN = 'cricket-live-pin-', LS_LASTPOOL = 'cricket-last-pool', LS_LASTSPLIT = 'cricket-last-split';
var EXPIRE_HOURS = 24;   /* must match the 86400000 in the database rules */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
M = newMatch();
/* ------------------------------ helpers ------------------------------ */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uniq(arr){ var out=[]; arr.forEach(function(x){ if(x && !out.some(function(y){ return same(x,y); })) out.push(x); }); return out; }
function asList(x){
  if(!x) return [];
  if(Array.isArray(x)) return x.filter(Boolean);
  return Object.keys(x).sort(function(a, b){ return a - b; }).map(function(k){ return x[k]; }).filter(Boolean);
}
function squadList(side){ return asList(side==='a' ? M.setup.playersA : M.setup.playersB); }
function squadRole(side){
  var S = M.setup;
  return side==='a' ? {cap:S.capA||'', vc:S.vcA||'', wk:S.wkA||'', tw:S.twA||''} : {cap:S.capB||'', vc:S.vcB||'', wk:S.wkB||'', tw:S.twB||''};
}
var HANDS = [{v:'R', l:'Right-hand bat', a:'RHB'}, {v:'L', l:'Left-hand bat', a:'LHB'}];
var STYLES = [
  {v:'RAOS', l:'Right-arm off spin', a:'RAOS'}, {v:'LAOS', l:'Slow left-arm orthodox', a:'SLA'},
  {v:'RALS', l:'Right-arm leg spin', a:'RALS'}, {v:'LALS', l:'Left-arm leg spin', a:'LALS'},
  {v:'RAM', l:'Right-arm medium', a:'RAM'}, {v:'LAM', l:'Left-arm medium', a:'LAM'},
  {v:'RAF', l:'Right-arm fast', a:'RAF'}, {v:'LAF', l:'Left-arm fast', a:'LAF'}];
function infoList(){ return asList(M.setup.pinfo); }
function infoOf(name){ var l = infoList(); for(var k = 0; k < l.length; k++){ if(same(l[k].n, name)) return l[k]; } return null; }
function handOf(name){ var i = infoOf(name); if(!i || !i.h) return null; for(var k = 0; k < HANDS.length; k++){ if(HANDS[k].v === i.h) return HANDS[k]; } return null; }
function styleOf(name){ var i = infoOf(name); if(!i || !i.b) return null; for(var k = 0; k < STYLES.length; k++){ if(STYLES[k].v === i.b) return STYLES[k]; } return null; }
function detailText(name){ var p = [], hh = handOf(name), ss = styleOf(name); if(hh) p.push(hh.l); if(ss) p.push(ss.l); return p.join(', '); }
function subLabel(name, kind){
  var o = kind==='bat' ? handOf(name) : styleOf(name);
  return o ? '<div class="lbl" style="font-weight:500">' + esc(o.l) + '</div>' : '';
}
function abbrSpan(name, kind){
  var o = kind==='bat' ? handOf(name) : styleOf(name);
  return o ? ' <span class="lbl">' + o.a + '</span>' : '';
}
function isKeeper(name){
  if(!name) return false;
  var a = squadRole('a').wk, b = squadRole('b').wk;
  return !!((a && same(name, a)) || (b && same(name, b)));
}
function roleTag(name){
  var roles = [];
  ['a','b'].forEach(function(side){
    var r = squadRole(side);
    if(r.cap && same(name, r.cap)) roles.push('c');
    if(r.vc && same(name, r.vc)) roles.push('vc');
    if(r.wk && same(name, r.wk)) roles.push('wk');
    if(r.tw && same(name, r.tw)) roles.push('12th');
  });
  return roles.length ? ' (' + roles.join(', ') + ')' : '';
}
/* every player we know for a team: the squad, plus anyone who batted, bowled or fielded for them (added as they come in) */
function knownPlayers(side){
  var out = squadList(side).slice();
  M.inns.forEach(function(inn, i){
    var bat = battingSide(i) === side;
    inn.events.forEach(function(ev){
      if(bat){ ['striker','non','newBatter'].forEach(function(f){ if(ev[f]) out.push(ev[f]); }); }
      else {
        if(ev.t==='start' && ev.bowler) out.push(ev.bowler);
        if(ev.t==='bowler' && ev.name) out.push(ev.name);
        if(ev.w && ev.w.fielder) out.push(ev.w.fielder);
      }
    });
  });
  return uniq(out);
}
function parseNames(text){
  var parts = String(text || '').split(/\r?\n|,/), out = [];
  parts.forEach(function(p){
    var n = p.replace(/\s+/g, ' ').trim().slice(0, 40);
    if(n && !out.some(function(x){ return same(x, n); })) out.push(n);
  });
  return out.slice(0, 15);
}
function partOpen(c, k){ var p = partRow(c, k, ''); p.open = true; return p; }
function partText(p){
  var t = p.a + ' ' + p.ra + ' (' + p.ba + ') & ' + p.b + ' ' + p.rb + ' (' + p.bb + ')';
  if(p.ex) t += ', extras ' + p.ex;
  return t + ': ' + p.runs + ' runs off ' + p.balls + ' balls';
}
function waitFor(test, ms){
  return new Promise(function(res){
    var t0 = Date.now();
    (function poll(){ if(test() || Date.now() - t0 > ms) res(test()); else setTimeout(poll, 100); })();
  });
}
function squadBlock(side){
  var list = squadList(side), r = squadRole(side), known = knownPlayers(side), sc = isScorer();
  var extra = known.filter(function(x){ return !list.some(function(y){ return same(x, y); }) && !(r.tw && same(x, r.tw)); });
  function row(x, note){
    var det = detailText(x);
    return '<div class="line lg"><div class="nm">' + esc(x) + esc(roleTag(x)) + (note ? ' <span class="lbl">' + note + '</span>' : '') +
      (det ? '<div class="lbl" style="font-weight:500">' + esc(det) + '</div>' : '') + '</div>' +
      (sc ? '<button class="chip" data-p="' + esc(x) + '">Details</button>' : '') + '</div>';
  }
  var html = '<div class="line"><div class="nm">' + esc(teamName(side)) + '</div>' + (sc ? '<button class="chip" data-m="squad' + side + '">Edit squad</button>' : '') + '</div>';
  if(!list.length && !extra.length && !r.tw) html += '<div class="line"><span class="lbl">No squad entered. Names are added as players come in.</span></div>';
  list.forEach(function(x){ html += row(x, ''); });
  extra.forEach(function(x){ html += row(x, 'added during the match'); });
  if(r.tw) html += row(r.tw, '');
  return html;
}
function libTid(side){ return M.setup.poolTid || M.setup[side==='a' ? 'tidA' : 'tidB'] || ''; }
function poolFor(side){
  var tid = libTid(side); if(!tid) return [];
  var list = libPlayers(tid);
  if(M.setup.poolTid){
    var oth = squadList(side==='a' ? 'b' : 'a');
    list = list.filter(function(p){ return !oth.some(function(x){ return same(x, p.n); }); });
  }
  return list;
}
function splitRandom(names){
  var arr = names.slice();
  for(var k = arr.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)); var t = arr[k]; arr[k] = arr[j]; arr[j] = t; }
  var half = Math.ceil(arr.length / 2);
  return {a:arr.slice(0, half), b:arr.slice(half)};
}
/* starting point for the team chooser: this match's teams, else the teams from the last match with this pool */
function splitInitial(){
  var tid = M.setup.poolTid, pool = tid ? libPlayers(tid).map(function(p){ return p.n; }) : [];
  var a0 = squadList('a'), b0 = squadList('b');
  if(!a0.length && !b0.length){
    try{ var ls = JSON.parse(lsGet(LS_LASTSPLIT) || '{}'); if(ls.pool === tid){ a0 = ls.a || []; b0 = ls.b || []; } }catch(e){}
  }
  var all = uniq(pool.concat(a0).concat(b0)), st = {};
  all.forEach(function(n){
    st[n] = a0.some(function(x){ return same(x, n); }) ? 'a' : (b0.some(function(x){ return same(x, n); }) ? 'b' : 'o');
  });
  return {all:all, st:st};
}
async function editSplit(){
  if(!isScorer()){ toast('Only the scorer can choose the teams'); return; }
  if(!M.setup.poolTid){ toast('This match has no player pool'); return; }
  if(isAdmin()){ try{ await loadLib(); }catch(e){} }
  var init = splitInitial(), all = init.all.slice(), st = init.st, added = [];
  var res = await sheet(function(sh, close){
    sh.innerHTML = '<h2>Choose the teams</h2>' +
      '<p class="sub">For each player tap Out, In, A or B. "In" means playing but not in a team yet. Random split shares everyone marked In, A or B between the two teams.</p>' +
      '<div class="acts" style="margin-top:0"><button class="btn alt" data-x="allin">Everyone in</button><button class="btn alt" data-x="rand">Random split</button><button class="btn alt" data-x="clear">Clear</button></div>' +
      '<div class="lbl" id="spc" style="margin:8px 0"></div><div class="card" id="spl"></div>' +
      '<div class="field"><label>Add a new player</label><div class="two"><input type="text" id="spn" autocomplete="off" placeholder="Name"><button class="btn alt" data-x="add">Add</button></div></div>' +
      '<div class="acts"><button class="btn alt" data-x="c">Cancel</button><button class="btn" data-x="ok">Save teams</button></div>';
    var list = sh.querySelector('#spl'), cnt = sh.querySelector('#spc');
    function count(s){ return all.filter(function(n){ return st[n] === s; }).length; }
    function draw(){
      var lab = {o:'Out', i:'In', a:'A', b:'B'};
      list.innerHTML = all.map(function(n, k){
        return '<div class="line lg"><div class="nm">' + esc(n) + '</div><div class="seg4" data-k="' + k + '">' +
          ['o','i','a','b'].map(function(s){ return '<button data-s="' + s + '" class="' + (st[n] === s ? 'on' : '') + '">' + lab[s] + '</button>'; }).join('') + '</div></div>';
      }).join('') || '<div class="line"><span class="lbl">No players yet. Add names below.</span></div>';
      cnt.textContent = 'Team A: ' + count('a') + '   Team B: ' + count('b') + '   In, not in a team yet: ' + count('i');
    }
    draw();
    sh.addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      if(b.dataset.s){ var row = b.closest('[data-k]'); st[all[+row.dataset.k]] = b.dataset.s; draw(); return; }
      var x = b.dataset.x;
      if(x==='c') close(null);
      else if(x==='allin'){ all.forEach(function(n){ if(st[n] === 'o') st[n] = 'i'; }); draw(); }
      else if(x==='clear'){ all.forEach(function(n){ st[n] = 'o'; }); draw(); }
      else if(x==='rand'){
        var ps = all.filter(function(n){ return st[n] !== 'o'; });
        if(ps.length < 2){ toast('Mark at least two players In first'); return; }
        var sp = splitRandom(ps);
        sp.a.forEach(function(n){ st[n] = 'a'; }); sp.b.forEach(function(n){ st[n] = 'b'; });
        draw();
      }
      else if(x==='add'){
        var inp = sh.querySelector('#spn');
        parseNames(inp.value).forEach(function(n){
          var at = -1; all.forEach(function(y, k){ if(same(y, n)) at = k; });
          if(at < 0){ all.push(n); added.push(n); at = all.length - 1; }
          st[all[at]] = 'i';
        });
        inp.value = ''; draw();
      }
      else if(x==='ok'){
        var A = all.filter(function(n){ return st[n] === 'a'; }), B = all.filter(function(n){ return st[n] === 'b'; });
        if(count('i')){ toast('Put every player marked In into team A or B, or mark them Out'); return; }
        if(A.length > 15 || B.length > 15){ toast('Each team can have up to 15 players'); return; }
        if(!A.length && !B.length){ toast('Pick at least one player'); return; }
        close({a:A, b:B, added:added});
      }
    });
  });
  if(!res) return;
  var upd = {playersA: res.a.length ? res.a : null, playersB: res.b.length ? res.b : null};
  ['a','b'].forEach(function(s){
    var k = s==='a' ? 'A' : 'B', r = squadRole(s), list = s==='a' ? res.a : res.b;
    function gone(nm){ return nm && !list.some(function(x){ return same(x, nm); }); }
    if(gone(r.cap)) upd['cap' + k] = '';
    if(gone(r.vc)) upd['vc' + k] = '';
    if(gone(r.wk)) upd['wk' + k] = '';
  });
  try{
    await LIVE.fb.update(dbRef('matches/' + LIVE.mid + '/setup'), upd);
    lsSet(LS_LASTSPLIT, JSON.stringify({pool:M.setup.poolTid, a:res.a, b:res.b}));
    toast('Teams saved');
    if(res.added.length) libSync('a', res.added, null);
  }
  catch(err){ writeError(err); }
}

async function createMatch(){
  if(!lsGet(LS_ADMIN)){ toast('Only the club admin can start a match. Use the admin starting link.'); return; }
  var kind = await choose('New match', [
    {l:'Two saved teams (for example Milan v Bergamo)', v:'teams'},
    {l:'Friendly: split one player pool into two teams', v:'pool'}], {cols:1, sub:'Which kind of match is it?'});
  if(!kind) return;
  if(kind==='pool') await createPoolMatch(); else await createTeamsMatch();
}
async function createPoolMatch(){
  var adminKey = lsGet(LS_ADMIN);
  try{ await loadLib(true); }catch(err){ LIB.teams = {}; }
  var teams = libTeams();
  if(!teams.length){ toast('First add your pool under Teams and players, for example "Pavia Cricketers"'); return; }
  var last = {}; try{ last = JSON.parse(lsGet(LS_LASTPOOL) || '{}'); }catch(e){ last = {}; }
  var opts = teams.map(function(t){ return {v:t.id, l:t.name + ' (' + t.count + ' players)'}; });
  var vals = {pool:(last.pool && LIB.teams[last.pool]) ? last.pool : teams[0].id, na:last.na || 'Team A', nb:last.nb || 'Team B',
    batFirst:'a', overs:String(last.overs || 8), name:lsGet(LS_NAME) || '', pin:last.pin || ''};
  var nameA, nameB, overs;
  for(;;){
    var f = await form('Friendly match from a pool', 'Players come from the saved pool. You will split them into two teams next.', [
      {k:'pool', label:'Player pool', type:'select', value:vals.pool, options:opts},
      {k:'na', label:'Team A name', value:vals.na, ph:'e.g. Blues'},
      {k:'nb', label:'Team B name', value:vals.nb, ph:'e.g. Reds'},
      {k:'batFirst', label:'Who bats first', type:'select', value:vals.batFirst, options:[{v:'a', l:'Team A'},{v:'b', l:'Team B'}]},
      {k:'overs', label:'Overs per innings', type:'number', value:vals.overs},
      {k:'name', label:'Your name (you will score first)', value:vals.name, ph:'e.g. Ali'},
      {k:'pin', label:'Match PIN (4 to 12 letters or numbers)', value:vals.pin, ph:'e.g. 4821'}
    ], 'Create match');
    if(!f) return;
    vals = f;
    nameA = f.na.replace(/\s+/g, ' ').trim().slice(0, 40); nameB = f.nb.replace(/\s+/g, ' ').trim().slice(0, 40);
    overs = parseInt(f.overs, 10);
    if(!f.pool || !LIB.teams[f.pool]){ toast('Choose a player pool'); continue; }
    if(!nameA || !nameB){ toast('Give both teams a name'); continue; }
    if(same(nameA, nameB)){ toast('Team A and Team B must have different names'); continue; }
    if(isNaN(overs) || overs < 1 || overs > 100){ toast('Overs must be 1 to 100'); continue; }
    if(!f.name){ toast('Enter your name'); continue; }
    if(!/^[A-Za-z0-9]{4,12}$/.test(f.pin)){ toast('PIN: 4 to 12 letters or numbers, no spaces'); continue; }
    break;
  }
  var mid = newMid(), step = '';
  try{
    step = 'admin key';
    await withTimeout(LIVE.fb.set(dbRef('adminClaims/' + LIVE.uid), adminKey), 10000);
    step = 'match PIN (admin key check)';
    await withTimeout(LIVE.fb.set(dbRef('pins/' + mid), vals.pin), 10000);
    step = 'PIN claim';
    await withTimeout(LIVE.fb.set(dbRef('claims/' + mid + '/' + LIVE.uid), vals.pin), 10000);
    step = 'scorer role';
    await claimScorer(mid, vals.name);
    step = 'match start time';
    await withTimeout(LIVE.fb.set(dbRef('matches/' + mid + '/created'), LIVE.fb.serverTimestamp()), 10000);
    step = 'match settings';
    var setup = newMatch().setup;
    setup.a = nameA; setup.b = nameB; setup.poolTid = vals.pool; setup.batFirst = vals.batFirst; setup.overs = overs;
    await withTimeout(LIVE.fb.set(dbRef('matches/' + mid + '/setup'), setup), 10000);
  }catch(err){
    if(isPermission(err)) toast('The database refused this step: ' + step + '. ' + (step === 'admin key' || step.indexOf('PIN (admin') === 0 ? 'Check the adminKey in Firebase matches your starting link, and that the new rules are published.' : 'Check the new rules are published in Firebase.'));
    else toast('Could not create the match: ' + ((err && err.message) || err));
    return;
  }
  lsSet(LS_NAME, vals.name);
  lsSet(LS_PIN + mid, vals.pin);
  lsSet(LS_LASTPOOL, JSON.stringify({pool:vals.pool, na:nameA, nb:nameB, overs:overs, pin:vals.pin}));
  location.hash = '#m=' + mid;
  route();
  await info('Match created', 'Share the link with everyone so they can watch.\n\nMatch PIN: ' + vals.pin + '\nGive the PIN only to people who will score.');
  await shareLink();
  await waitFor(function(){ return isScorer(); }, 4000);
  if(isScorer()){
    await editSplit();
    if(squadList('a').length && await yesno('Set captains and keepers now?', 'Choose the captain, vice-captain, wicket-keeper and 12th man for each team. You can skip this.', 'Set now')){
      await editSquad('a');
      await editSquad('b');
    }
  }
}
/* ============ PERMANENT TEAM LIBRARY ============
   teams/{id}: { name, players: { key: {n:name, h:hand, b:bowling style, m:last match} } }
   Only the admin can read the whole library. A match's scorer can only ADD or UPDATE players of that match's two teams. */
var LIB = {teams:{}, loaded:false};
function byName(a, b){ return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; }
function pkey(name){
  var k = String(name).toLowerCase().replace(/[.$#\[\]\/\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
  return k || 'x';
}
function isAdmin(){ return !!lsGet(LS_ADMIN); }
async function ensureAdminClaim(){
  var k = lsGet(LS_ADMIN); if(!k) throw new Error('NOT_ADMIN');
  await withTimeout(LIVE.fb.set(dbRef('adminClaims/' + LIVE.uid), k), 10000);
}
async function loadLib(force){
  if(!isAdmin()) return;
  if(!force && LIB.loaded && LIB.at && Date.now() - LIB.at < 60000) return;
  await ensureAdminClaim();
  var snap = await withTimeout(LIVE.fb.get(dbRef('teams')), 10000);
  LIB.teams = snap.val() || {}; LIB.loaded = true; LIB.at = Date.now();
}
function libTeams(){
  return Object.keys(LIB.teams).map(function(id){
    var t = LIB.teams[id] || {};
    return {id:id, name:t.name || '(unnamed)', count:Object.keys(t.players || {}).filter(function(k){ return t.players[k] && t.players[k].n; }).length};
  }).sort(byName);
}
function libName(tid){ return (LIB.teams[tid] || {}).name || ''; }
function libPlayers(tid){
  var t = LIB.teams[tid]; if(!t || !t.players) return [];
  return Object.keys(t.players).map(function(k){ var p = t.players[k]; return p && p.n ? {key:k, name:p.n, n:p.n, h:p.h || '', b:p.b || ''} : null; })
    .filter(Boolean).sort(byName);
}
function detMapOf(det){ var m = {}; (det || []).forEach(function(d){ m[String(d.n).toLowerCase()] = {h:d.h || '', b:d.b || ''}; }); return m; }
function sideOfName(name){
  var sides = ['a','b'];
  for(var k = 0; k < 2; k++){ if(knownPlayers(sides[k]).some(function(x){ return same(x, name); })) return sides[k]; }
  return '';
}
/* best effort: if the database refuses (for example the match has no saved team), scoring carries on */
async function libSync(side, names, details){
  var tid = libTid(side);
  if(!tid || !LIVE.mid || !names || !names.length) return;
  var upd = {};
  names.forEach(function(n){
    var k = pkey(n);
    upd['players/' + k + '/n'] = n;
    upd['players/' + k + '/m'] = LIVE.mid;
    var d = details && details[String(n).toLowerCase()];
    if(d){ upd['players/' + k + '/h'] = d.h || ''; upd['players/' + k + '/b'] = d.b || ''; }
  });
  try{ await withTimeout(LIVE.fb.update(dbRef('teams/' + tid), upd), 10000); }catch(e){}
}
function libAutoAdd(ev, inn){
  var bs = battingSide(inn), fs = bs==='a' ? 'b' : 'a', add = {a:[], b:[]};
  if(ev.t==='start'){ add[bs].push(ev.striker, ev.non); add[fs].push(ev.bowler); }
  if(ev.t==='bowler' && ev.name) add[fs].push(ev.name);
  if(ev.newBatter) add[bs].push(ev.newBatter);
  if(ev.w && ev.w.fielder) add[fs].push(ev.w.fielder);
  ['a','b'].forEach(function(s){
    var fresh = add[s].filter(function(n){
      if(!n) return false;
      var key = LIVE.mid + s + pkey(n);
      if(LIVE.libSent[key]) return false;
      LIVE.libSent[key] = 1; return true;
    });
    if(fresh.length) libSync(s, fresh, null);
  });
}

async function editSquad(side){
  if(!isScorer()){ toast('Only the scorer can change the squad'); return; }
  var r = squadRole(side), cur = squadList(side);
  var tid = libTid(side), pool = [];
  if(tid && isAdmin()){ try{ await loadLib(); pool = poolFor(side); }catch(e){ pool = []; } }
  var res = await sheet(function(sh, close){
    sh.innerHTML = '<h2>' + esc(teamName(side)) + ' squad</h2>' +
      '<p class="sub">One player per line (up to 15). You can leave this empty and names will be added as players come in.</p>' +
      (pool.length ? '<div class="lbl">Saved players: tap a name to add or remove it</div><div class="chips" id="sqpool"></div>' : '') +
      '<div class="field"><label>Players</label><textarea id="sqp" placeholder="One name per line">' + esc(cur.join('\n')) + '</textarea></div>' +
      '<div class="two"><div class="field"><label>Captain</label><select id="sqc"></select></div><div class="field"><label>Vice-captain</label><select id="sqv"></select></div></div>' +
      '<div class="two"><div class="field"><label>Wicket-keeper</label><select id="sqw"></select></div><div class="field"><label>12th man (optional)</label><input type="text" id="sqt" autocomplete="off" value="' + esc(r.tw) + '" placeholder="Name"></div></div>' +
      '<div class="h3" style="margin-top:6px">Batting hand and bowling style (optional)</div><div id="sqd"></div>' +
      '<div class="acts"><button class="btn alt" data-x="c">Cancel</button><button class="btn" data-x="ok">Save squad</button></div>';
    var ta = sh.querySelector('#sqp'), st12 = sh.querySelector('#sqt'), box = sh.querySelector('#sqd'), poolBox = sh.querySelector('#sqpool');
    var sels = {c:sh.querySelector('#sqc'), v:sh.querySelector('#sqv'), w:sh.querySelector('#sqw')};
    var info = {}, ns = [];

function allNames(){
  var n = [];
  ['a','b'].forEach(function(side){
    squadList(side).forEach(function(x){ n.push(x); });
    var r = squadRole(side); if(r.tw) n.push(r.tw);
  });
  M.inns.forEach(function(inn){ inn.events.forEach(function(ev){
    ['striker','non','bowler','name','newBatter'].forEach(function(f){ if(ev[f]) n.push(ev[f]); });
    if(ev.w && ev.w.fielder) n.push(ev.w.fielder);
  }); });
  return uniq(n);
}
function canon(name){
  name = String(name||'').replace(/\s+/g,' ').trim();
  var k = allNames();
  for(var j=0;j<k.length;j++){ if(same(k[j],name)) return k[j]; }
  return name;
}
function toast(msg){
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
function curIdx(){ return M.inns.length - 1; }

/* names for quick-pick chips */
function batChips(i){
  var side = battingSide(i), st = M.inns[i] ? replay(i) : null, tw = squadRole(side).tw;
  var onCard = st ? st.batters.map(function(b){ return b.name; }) : [];
  return knownPlayers(side).filter(function(x){ return !onCard.some(function(y){ return same(x, y); }) && !(tw && same(x, tw)); });
}
function bowlChips(i){
  var fs = battingSide(i)==='a' ? 'b' : 'a', tw = squadRole(fs).tw;
  return knownPlayers(fs).filter(function(x){ return !(tw && same(x, tw)); });
}
function fieldChips(i){ var fs = battingSide(i)==='a' ? 'b' : 'a', r = squadRole(fs); return uniq((r.wk ? [r.wk] : []).concat(knownPlayers(fs)).concat(r.tw ? [r.tw] : [])); }

/* ------------------------------ sheets ------------------------------- */
function sheet(build){
  return new Promise(function(res){
    var ov = document.createElement('div'); ov.className = 'overlay';
    var sh = document.createElement('div'); sh.className = 'sheet'; ov.appendChild(sh);
    function close(v){ ov.remove(); res(v); }
    build(sh, close);
    ov.addEventListener('click', function(e){ if(e.target===ov) close(null); });
    document.body.appendChild(ov);
  });
}
/* options: [{l,v}] or [{h:'heading'}] */
function choose(title, options, o){
  o = o || {};
  return sheet(function(sh, close){
    var html = '<h2>' + esc(title) + '</h2>' + (o.sub ? '<p class="sub">' + esc(o.sub) + '</p>' : '') + '<div class="grid" style="--c:' + (o.cols||2) + '">';
    options.forEach(function(x, k){
      if(x.h) html += '<div class="h">' + esc(x.h) + '</div>';
      else html += '<button class="opt" data-k="' + k + '">' + esc(x.l) + '</button>';
    });
    html += '</div><div class="acts"><button class="btn alt" data-c="1">Cancel</button></div>';
    sh.innerHTML = html;
    sh.addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      if(b.dataset.c) close(null);
      else if(b.dataset.k!=null) close(options[+b.dataset.k].v);
    });
  });
}
function yesno(title, msg, yes){

/* text prompt; returns string, '' (skipped) or null (cancelled) */
function ask(o){
  return sheet(function(sh, close){
    var chips = (o.chips||[]).map(function(c){ return '<button class="chip" data-chip="' + esc(c) + '">' + esc(c) + '</button>'; }).join('');
    sh.innerHTML = '<h2>' + esc(o.title) + '</h2>' + (o.sub ? '<p class="sub">' + esc(o.sub) + '</p>' : '') +
      '<input type="text" id="askin" autocomplete="off" autocapitalize="words" placeholder="' + esc(o.ph||'Number or name') + '">' +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      '<div class="acts"><button class="btn alt" data-x="c">Cancel</button>' + (o.optional ? '<button class="btn alt" data-x="s">Skip</button>' : '') + '<button class="btn" data-x="ok">OK</button></div>';

function copyText(t){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select(); var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove(); return ok;
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function(){ return true; }, function(){ return fallback(); });
  }catch(e){}
  return Promise.resolve(fallback());
}
function textBox(title, text, restore){

/* ---------------------------- scoring flow --------------------------- */
function ready(){
  var i = curIdx(); if(i<0) return false;
  if(!isScorer()){ toast('Only the scorer can do that'); return false; }
  var st = replay(i);
  return st.started && !st.done && !st.needBowler;
}
async function commit(ev){
  var i = curIdx();
  try{ await appendEvent(ev, i); }
  catch(err){ writeError(err); return; }
  buzz(); render();
  await afterChange();
}
async function afterChange(){
  var i = curIdx(); if(i<0) return;
  var st = replay(i);
  if(st.done){ render(); await announceDone(i, st); }
  else if(st.needBowler){ await pickBowler(false); }
}
async function announceDone(i, st){
  var msg = batTeam(i) + ' ' + st.score + '/' + st.wkts + ' (' + fmtOv(st.balls) + ' overs)';
  if(i===0){
    await info('Innings 1 complete', st.doneReason + '\n' + msg + '\nTarget: ' + (st.score+1) + '\n\nOpen the Score tab and start innings 2.');
  } else {
    await sheet(function(sh, close){
      sh.innerHTML = '<h2>Match complete</h2><p class="sub" style="white-space:pre-line">' + esc(msg + '\n\n' + (matchResult() || st.doneReason)) + '</p>' +
        '<div class="acts"><button class="btn alt" data-v="0">Close</button><button class="btn" data-v="1">Download PDF</button></div>';
      sh.addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        if(b.dataset.v==='1') downloadPDF();
        close(true);
      });
    });
    await offerLock();
  }
}
async function pickBowler(mid){
  var i = curIdx(), st = replay(i);
  for(;;){
    var nm = await ask({
      title: mid ? 'Change bowler' : 'Next bowler',
      sub: mid ? 'Replacement for ' + st.bowler + '. A maiden will not be credited for this over.' : 'Over ' + st.overs + ' complete. Last over: ' + st.bowler,
      chips: bowlChips(i).filter(function(x){ return !same(x, st.bowler); })
    });
    if(!nm) return false;
    var name = canon(nm);
    if(!mid && same(name, st.bowler)){
      if(!(await yesno('Same bowler', name + ' bowled the previous over. Use him anyway?'))) continue;
    }
    var lim = M.setup.maxBowlerOvers, bo = st.bowlers.filter(function(b){ return same(b.name,name); })[0];
    if(lim>0 && bo && bo.balls >= lim*6){
      if(!(await yesno('Over limit', name + ' has bowled ' + Math.floor(bo.balls/6) + ' over(s); the limit is ' + lim + '. Allow anyway?'))) continue;
    }
    try{ await appendEvent({t:'bowler', name:name}, i); }
    catch(err){ writeError(err); return false; }
    render();
    return true;
  }
}
async function newBatterPrompt(i, st, outName, retired){
  for(;;){
    var nm = await ask({
      title: 'New batter',
      sub: retired ? outName + ' retires.' : 'Wicket! ' + outName + ' is out.',
      chips: batChips(i)
    });
    if(nm===null) return null;
    var name = canon(nm);
    if(st.batters.some(function(b){ return same(b.name,name); })){ toast(name + ' is already on this innings'); continue; }
    return name;
  }
}
async function startInnings(){
  var idx = M.inns.length;
  if(idx>=2) return;
  if(idx===1 && !replay(0).done) return;
  var sub = batTeam(idx) + ' batting, innings ' + (idx+1);
  var s = await ask({title:'Opening striker', sub:sub, chips:batChips(idx)}); if(!s) return;
  s = canon(s);
  var n = await ask({title:'Opening non-striker', sub:sub, chips:batChips(idx).filter(function(x){ return !same(x,s); })}); if(!n) return;
  n = canon(n);
  if(same(s,n)){ toast('Striker and non-striker must be different'); return; }
  var b = await ask({title:'Opening bowler', sub:bowlTeam(idx) + ' bowling', chips:bowlChips(idx)}); if(!b) return;
  try{ await appendEvent({t:'start', striker:s, non:n, bowler:canon(b)}, idx); }
  catch(err){ writeError(err); return; }
  render();
}
function runs(n){
  if(!ready()) return;
  return commit({t:'ball', bat:n, wd:0, nb:0, bye:0, lb:0, label:String(n)});
}
async function wide(){
  if(!ready()) return;
  var x = await choose('Wide', [{l:'Wide only',v:0},{l:'+1',v:1},{l:'+2',v:2},{l:'+3',v:3},{l:'+4 (boundary)',v:4},{l:'+5',v:5}], {sub:'1 run is added automatically. Extra runs run:', cols:3});
  if(x===null) return;
  return commit({t:'ball', bat:0, wd:1+x, nb:0, bye:0, lb:0, label: x ? 'Wd+'+x : 'Wd'});
}
async function noball(){
  if(!ready()) return;
  var opts = [{h:'Runs off the bat'}], k;
  for(k=0;k<=6;k++) opts.push({l:String(k), v:'bat:'+k});
  opts.push({h:'Byes'}); for(k=1;k<=4;k++) opts.push({l:'Bye '+k, v:'bye:'+k});
  opts.push({h:'Leg byes'}); for(k=1;k<=4;k++) opts.push({l:'Leg bye '+k, v:'lb:'+k});
  var x = await choose('No ball', opts, {sub:'1 run is added automatically.', cols:4});
  if(x===null) return;
  var p = x.split(':'), n = +p[1], ev = {t:'ball', bat:0, wd:0, nb:1, bye:0, lb:0, label:'Nb'};
  if(p[0]==='bat'){ ev.bat = n; if(n) ev.label = 'Nb+'+n; }
  else if(p[0]==='bye'){ ev.bye = n; ev.label = 'Nb+B'+n; }
  else { ev.lb = n; ev.label = 'Nb+L'+n; }
  return commit(ev);
}
async function byes(kind){
  if(!ready()) return;
  var opts = [1,2,3,4,5,6].map(function(x){ return {l:String(x), v:x}; });
  var x = await choose(kind==='bye' ? 'Byes' : 'Leg byes', opts, {sub:'How many runs?', cols:3});
  if(x===null) return;
  var ev = {t:'ball', bat:0, wd:0, nb:0, bye:0, lb:0, kind:kind};
  if(kind==='bye'){ ev.bye = x; ev.label = 'B'+x; } else { ev.lb = x; ev.label = 'Lb'+x; }
  return commit(ev);
}
async function wicket(){
  if(!ready()) return;
  var i = curIdx(), st = replay(i);
  var type = await choose('How out?', [
    {l:'Bowled',v:'bowled'},{l:'Caught',v:'caught'},{l:'LBW',v:'lbw'},{l:'Run out',v:'runout'},
    {l:'Stumped',v:'stumped'},{l:'Hit wicket',v:'hitwicket'},{l:'Other',v:'other'}], {cols:2});
  if(!type) return;
  var w = {type:type, out:'S'}, ev = {t:'ball', bat:0, wd:0, nb:0, bye:0, lb:0, w:w, label:'W'}, f, c, who;
  var fch = fieldChips(i);
  if(type==='caught'){
    f = await ask({title:'Caught by', chips:fch, optional:true}); if(f===null) return;
    w.fielder = f ? canon(f) : '';
  } else if(type==='runout'){
    who = await choose('Who is out?', [{l:st.striker + ' (on strike)', v:'S'},{l:st.non + ' (non-striker)', v:'N'}], {cols:1}); if(who===null) return;
    w.out = who;
    var rd = await choose('Runs completed before the run out', [0,1,2,3,4,5].map(function(x){ return {l:String(x), v:x}; }), {cols:6}); if(rd===null) return;
    var dt = await choose('Type of delivery', [{l:'Normal',v:'n'},{l:'Wide',v:'wd'},{l:'No ball',v:'nb'},{l:'Bye',v:'b'},{l:'Leg bye',v:'lb'}], {cols:2}); if(dt===null) return;
    if(dt==='n') ev.bat = rd; else if(dt==='wd') ev.wd = 1+rd; else if(dt==='nb'){ ev.nb = 1; ev.bat = rd; } else if(dt==='b') ev.bye = rd; else ev.lb = rd;
    f = await ask({title:'Fielder who broke the wicket', chips:fch, optional:true}); if(f===null) return;
    w.fielder = f ? canon(f) : '';
  } else if(type==='stumped'){
    var kp = squadRole(battingSide(i)==='a' ? 'b' : 'a').wk;
    if(kp){ f = kp; } else { f = await ask({title:'Wicket-keeper', chips:fch, optional:true}); if(f===null) return; }
    w.fielder = f ? canon(f) : '';
    c = await choose('Was it a wide?', [{l:'No',v:0},{l:'Yes',v:1}]); if(c===null) return;
    if(c) ev.wd = 1;
  } else if(type==='other'){
    var d = await ask({title:'What happened?', sub:'e.g. obstructing the field, handled the ball, timed out', ph:'Description'}); if(!d) return;
    w.desc = d;
    who = await choose('Who is out?', [{l:st.striker + ' (on strike)', v:'S'},{l:st.non + ' (non-striker)', v:'N'}], {cols:1}); if(who===null) return;
    w.out = who;
  }
  if(ev.wd) ev.label = 'Wd+W'; else if(ev.nb) ev.label = 'Nb+W';
  var outName = w.out==='N' ? st.non : st.striker;

var ui = {tab:'score', cardInn:0, cardView:'card', busy:false, lib:{screen:'', tid:''}};

/* ============================ LIVE SYNC ============================== */
var SDK_VERSION = '10.12.2';
var STALE_MS = 120000;
var LIVE = {fb:null, db:null, uid:null, mid:'', ready:false, loaded:false, exists:true, missing:false, connected:true,
  offset:0, scorer:null, events:[], setup:null, unsub:[], error:'', closedAt:null, pendingPin:'', libSent:{}};

function configMissing(){ return String(FIREBASE_CONFIG.apiKey || '').indexOf('PASTE') === 0; }
function rid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function newMid(){ var s = ''; while(s.length < 8) s += Math.random().toString(36).slice(2); return s.slice(0, 8); }
function withTimeout(p, ms){
  return new Promise(function(res, rej){
    var t = setTimeout(function(){ rej(new Error('TIMEOUT')); }, ms);
    p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
  });
}
function nowMs(){ return Date.now() + (LIVE.offset || 0); }
function isScorer(){ return !!(!LIVE.closedAt && LIVE.scorer && LIVE.uid && LIVE.scorer.uid === LIVE.uid); }
function scorerFresh(){
  var s = LIVE.scorer; if(!s) return false;
  if(typeof s.hb !== 'number') return true;
  return nowMs() - s.hb < STALE_MS;
}
function dbRef(path){ return LIVE.fb.ref(LIVE.db, path); }
function isPermission(err){ var m = String((err && (err.code || err.message)) || '').toLowerCase(); return m.indexOf('permission') >= 0; }

async function liveInit(){
  if(LIVE.ready) return;
  var fb = globalThis.__FB_MOCK;
  if(!fb){
    var base = 'https://www.gstatic.com/firebasejs/' + SDK_VERSION + '/';
    var mods = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]);
    fb = Object.assign({}, mods[0], mods[1], mods[2]);
  }
  LIVE.fb = fb;
  var app = fb.initializeApp(FIREBASE_CONFIG);
  var auth = fb.getAuth(app);
  /* wait for the saved sign-in to load, so the same phone keeps the same identity (needed to stay the scorer after a reload) */
  if(auth.authStateReady) await auth.authStateReady();
  else await new Promise(function(r){ var u = fb.onAuthStateChanged(auth, function(){ try{ u(); }catch(e){} r(); }); });
  if(auth.currentUser){ LIVE.uid = auth.currentUser.uid; }
  else { var cred = await fb.signInAnonymously(auth); LIVE.uid = cred.user.uid; }
  LIVE.db = fb.getDatabase(app);
  fb.onValue(dbRef('.info/connected'), function(s){ LIVE.connected = !!s.val(); render(); });
  fb.onValue(dbRef('.info/serverTimeOffset'), function(s){ LIVE.offset = s.val() || 0; });
  LIVE.ready = true;
}

function eventsArray(raw){
  var out = [], k;
  if(!raw) return out;
  if(Array.isArray(raw)){
    for(k = 0; k < raw.length; k++){ if(raw[k]) out.push(raw[k]); else break; }
  } else {
    var keys = Object.keys(raw).map(Number).sort(function(a, b){ return a - b; });
    for(k = 0; k < keys.length; k++){ if(keys[k] !== k) break; out.push(raw[keys[k]]); }
  }
  return out;
}
function rebuildM(){
  var base = newMatch().setup;
  var setup = LIVE.setup ? Object.assign(base, LIVE.setup) : base;
  var m = {v:1, setup:setup, inns:[]};
  LIVE.events.forEach(function(ev){
    var i = ev.inn || 0;
    while(m.inns.length <= i) m.inns.push({events:[]});
    m.inns[i].events.push(ev);
  });
  M = m;
}
function closeMatch(){
  LIVE.unsub.forEach(function(u){ try{ u(); }catch(e){} });
  LIVE.unsub = [];
  LIVE.mid = ''; LIVE.loaded = false; LIVE.exists = true; LIVE.scorer = null; LIVE.events = []; LIVE.setup = null; LIVE.closedAt = null; LIVE.error = '';
  M = newMatch();
}
function remember(mid){
  var list = []; try{ list = JSON.parse(lsGet(LS_RECENT) || '[]'); }catch(e){ list = []; }
  list = list.filter(function(x){ return x.id !== mid; });
  list.unshift({id:mid, title:(M.setup.a + ' v ' + M.setup.b), at:Date.now()});
  lsSet(LS_RECENT, JSON.stringify(list.slice(0, 12)));
}
function openMatch(mid){
  closeMatch();
  LIVE.mid = mid;
  var un = LIVE.fb.onValue(dbRef('matches/' + mid), function(snap){
    var val = snap.val();
    LIVE.loaded = true;
    if(!val){ LIVE.exists = false; LIVE.setup = null; LIVE.events = []; LIVE.scorer = null; LIVE.closedAt = null; }
    else { LIVE.exists = true; LIVE.setup = val.setup || null; LIVE.events = eventsArray(val.events); LIVE.scorer = val.scorer || null; LIVE.closedAt = (typeof val.closedAt === 'number') ? val.closedAt : null; }
    rebuildM();
    if(val) remember(mid);
    render();
  }, function(err){
    LIVE.error = isPermission(err) ? 'This match link has expired, or it is not valid.' : ((err && err.message) || 'Could not read the match');
    LIVE.loaded = true; LIVE.exists = false; render();
  });
  LIVE.unsub.push(un);
}

/* add one event at the next free position. If another phone got there first, this fails safely. */
async function appendEvent(ev, inn){
  if(!isScorer()) throw new Error('NOT_SCORER');
  if(!LIVE.connected) throw new Error('OFFLINE');
  var e = JSON.parse(JSON.stringify(ev));
  e.inn = inn; e.id = rid();
  var n = LIVE.events.length, token = {cancelled:false};
  var res;
  try{
    res = await withTimeout(LIVE.fb.runTransaction(dbRef('matches/' + LIVE.mid + '/events/' + n), function(cur){
      if(token.cancelled) return undefined;
      return cur === null || cur === undefined ? e : undefined;
    }), 10000);
  }catch(err){ token.cancelled = true; throw err; }
  if(!res.committed) throw new Error('STALE');
  if(LIVE.events.length === n){ LIVE.events.push(e); rebuildM(); }
  libAutoAdd(e, inn);
  return n;
}
async function removeLastEvent(){
  if(!isScorer()) throw new Error('NOT_SCORER');
  if(!LIVE.connected) throw new Error('OFFLINE');
  var n = LIVE.events.length - 1, last = LIVE.events[n], token = {cancelled:false};
  if(!last) throw new Error('STALE');
  var res;
  try{
    res = await withTimeout(LIVE.fb.runTransaction(dbRef('matches/' + LIVE.mid + '/events/' + n), function(cur){
      if(token.cancelled) return undefined;
      return cur && cur.id === last.id ? null : undefined;
    }), 10000);
  }catch(err){ token.cancelled = true; throw err; }
  if(!res.committed) throw new Error('STALE');
  if(LIVE.events.length === n + 1){ LIVE.events.pop(); rebuildM(); }
}
function writeError(err){
  var m = String((err && err.message) || err);
  if(m === 'NOT_SCORER') toast('You are not the scorer');
  else if(m === 'OFFLINE') toast('No signal. That was NOT saved. Try again.');
  else if(m === 'TIMEOUT') toast('Slow signal. That may not have saved. Check the score, then try again.');
  else if(m === 'STALE') toast('Another phone scored first. Your screen is refreshing.');
  else if(isPermission(err)) toast('You are no longer the scorer');
  else toast('Could not save: ' + m);
  render();
}

/* ---- who is the scorer ---- */
async function claimScorer(mid, name){
  var token = {busy:false};
  var res = await withTimeout(LIVE.fb.runTransaction(LIVE.fb.ref(LIVE.db, 'matches/' + mid + '/scorer'), function(cur){
    var fresh = cur && typeof cur.hb === 'number' ? (nowMs() - cur.hb < STALE_MS) : !!cur;
    if(cur && cur.uid !== LIVE.uid && fresh){ token.busy = cur.name || 'Someone'; return undefined; }
    return {uid:LIVE.uid, name:name, hb:LIVE.fb.serverTimestamp()};
  }), 10000);
  if(!res.committed) throw new Error('BUSY:' + (token.busy || 'Someone'));
}

function extractMid(text){

  return '';
}

function stripHash(mid){

/* admin starting link (#admin=KEY) and scorer link (#m=ID&pin=PIN): read the secret, keep it, remove it from the address bar */
function absorbHash(){

  var a = /[#&]admin=([A-Za-z0-9]+)/.exec(hs), p = /[#&]pin=([A-Za-z0-9]+)/.exec(hs);

function renderLog(i, st){
  if(!st.log.length) return '<div class="start"><p>No balls yet.</p></div>';
  var groups = [], cur = null, pending = [];
  st.log.forEach(function(r){
    if(r.note){ pending.push(r); return; }
    var on = parseInt(r.over, 10);
    if(!cur || cur.over !== on){ cur = {over:on, bowler:r.bowler, rows:[], runs:0}; groups.push(cur); }
    pending.forEach(function(p){ cur.rows.push(p); }); pending = [];
    cur.rows.push(r); cur.runs += r.total;
  });
  if(pending.length){ if(!cur){ cur = {over:null, rows:[], runs:0}; groups.push(cur); } pending.forEach(function(p){ cur.rows.push(p); }); }
  var html = '<div class="acts" style="margin-top:0"><button class="btn alt" data-m="logtext">Copy ball log</button></div>';
  groups.slice().reverse().forEach(function(g){
    if(g.over===null){ html += '<div class="card">' + g.rows.map(function(r){ return '<div class="line lg"><div class="nm">' + esc(r.note) + '</div></div>'; }).join('') + '</div>'; return; }
    html += '<div class="h3">Over ' + (g.over+1) + ', ' + esc(g.bowler) + ': ' + g.runs + ' run' + (g.runs===1?'':'s') + '</div><div class="card">';
    html += g.rows.map(function(r){
      if(r.note) return '<div class="line lg"><div class="nm lbl">' + esc(r.note) + '</div></div>';
      return '<div class="line lg"><span class="ball num ' + ballClass(r.label) + '">' + esc(r.label) + '</span>' +
        '<div class="nm"><span class="lbl">' + esc(r.over) + '</span> ' + esc(r.bowler) + ' to ' + esc(r.striker) + '<span class="how" style="display:block;color:var(--muted);font-size:14px">' + esc(r.text) + '</span></div>' +
        '<div class="st num"><small>' + r.score + '/' + r.wkts + '</small></div></div>';
    }).join('') + '</div>';
  });
  return html;
}
function buildLogText(i){
  var st = replay(i), out = [batTeam(i) + ' innings, ball by ball'];
  st.log.forEach(function(r){
    if(r.note) out.push('  ' + r.note);
    else out.push(r.over + '  ' + r.bowler + ' to ' + r.striker + ': ' + r.text + '  (' + r.score + '/' + r.wkts + ')');
  });
  return out.join('\n');
}

function renderBar(){

  if(!LIVE.ready || !LIVE.mid){ b.className = ''; b.innerHTML = '<span>Cricket Scorer Live</span>'; return; }
  var s = LIVE.scorer, cls = '', txt = '', btn = '';
  if(!LIVE.connected){ cls = 'off'; txt = 'No signal. Reconnecting...'; }
  else if(LIVE.closedAt){
    var left = Math.max(0, Math.ceil((LIVE.closedAt + EXPIRE_HOURS * 3600000 - nowMs()) / 3600000));
    cls = 'view'; txt = 'Match finished and locked. This link expires in about ' + left + ' h.';
  }
  else if(isScorer()){ cls = 'me'; txt = 'You are the scorer'; btn = '<button data-a="handover">Hand over</button>'; }
  else if(!s){ cls = 'none'; txt = 'Nobody is scoring'; btn = '<button data-a="claim">Become scorer</button>'; }
  else if(scorerFresh()){ cls = 'view'; txt = esc(s.name) + ' is scoring. You are watching.'; }
  else {
    var mins = Math.max(1, Math.round((nowMs() - (s.hb || 0)) / 60000));
    cls = 'stale'; txt = esc(s.name) + ' not seen for ' + mins + ' min'; btn = '<button data-a="claim">Become scorer</button>';
  }
  b.className = cls;
  b.innerHTML = '<span>' + txt + '</span>' + btn;
}

    if(LIVE.error) msgScreen('Could not connect', LIVE.error + '\nCheck your signal, then try again.', '<button class="btn full" data-h="retry">Try again</button>');
    else msgScreen('Connecting...', 'Please wait.');
    return;
  }
  if(!LIVE.mid){ renderHome(); return; }
  if(!LIVE.loaded){ msgScreen('Loading match...', 'Please wait.'); return; }
  if(!LIVE.exists){ msgScreen(LIVE.error.indexOf('expired') >= 0 ? 'Link expired' : 'Match not found', LIVE.error || 'This link does not match any live game.', '<button class="btn full" data-m="home">Back to all matches</button>'); return; }
  document.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===ui.tab)); });
  if(ui.tab==='score') renderScore(); else if(ui.tab==='card') renderCard(); else renderMatch();
}

/* ------------------------------ text export -------------------------- */
function buildText(){
  var S = M.setup, out = [];
  out.push((S.title ? S.title + '\n' : '') + S.a + ' v ' + S.b + ' (' + S.overs + ' overs)');
  ['a','b'].forEach(function(side){
    var r = squadRole(side), names = knownPlayers(side).slice();
    if(r.tw) names.push(r.tw);
    names = uniq(names);
    if(names.length) out.push(teamName(side) + ': ' + names.map(function(x){ var dt = detailText(x); return x + roleTag(x) + (dt ? ' [' + dt + ']' : ''); }).join(', '));
  });
  M.inns.forEach(function(inn, i){
    var st = replay(i);
    out.push('');
    out.push(batTeam(i) + ' innings: ' + st.score + '/' + st.wkts + ' (' + fmtOv(st.balls) + ' ov)');
    st.batters.forEach(function(b){ out.push('  ' + b.name + roleTag(b.name) + '  ' + b.how + '  ' + b.runs + ' (' + b.balls + ')  4s ' + b.fours + '  6s ' + b.sixes); });
    var ex = st.extras;
    out.push('  Extras ' + (ex.wd+ex.nb+ex.b+ex.lb) + ' (b ' + ex.b + ', lb ' + ex.lb + ', w ' + ex.wd + ', nb ' + ex.nb + ')');
    if(st.fow.length) out.push('  FOW: ' + st.fow.map(function(f){ return f.n + '-' + f.score + ' (' + f.name + ', ' + f.over + ')'; }).join(', '));
    out.push('  Bowling:');
    st.bowlers.forEach(function(b){ out.push('  ' + b.name + roleTag(b.name) + '  ' + fmtOv(b.balls) + '-' + b.maidens + '-' + b.runs + '-' + b.wkts); });
    var ps = st.parts.slice(); if(st.cur) ps.push(partOpen(st.cur, st.parts.length + 1));
    if(ps.length){ out.push('  Partnerships:'); ps.forEach(function(p){ out.push('  ' + p.k + '. ' + partText(p) + (p.open ? ' (not out)' : ' (' + p.out + ')')); }); }
  });
  var r = matchResult(); if(r){ out.push(''); out.push(r); }
  return out.join('\n');
}

/* ------------------------------ PDF export --------------------------- */
function pdfEsc(s){ return s.replace(/[\\()]/g, '\\$&'); }
function pdfSafe(s){
  var o = '';
  for(var k=0;k<s.length;k++){
    var c = s.charCodeAt(k);
    if(c===9) o += ' '; else if(c<32) o += ''; else if(c===0x2020) o += String.fromCharCode(134); else if(c>255) o += '?'; else o += s.charAt(k);
  }
  return o;
}
function padR(s,n){ s = String(s); return s.length>n ? s.slice(0,n-1) + '.' : s + new Array(n - s.length + 1).join(' '); }
function padL(s,n){ s = String(s); return s.length>=n ? s.slice(-n) : new Array(n - s.length + 1).join(' ') + s; }
function wrapText(s,w){
  var out = [], words = String(s).split(' '), cur = '';
  words.forEach(function(wd){
    if(cur && (cur + ' ' + wd).length > w){ out.push(cur); cur = wd; }
    else cur = cur ? cur + ' ' + wd : wd;
  });
  if(cur) out.push(cur);
  if(!out.length) out.push('');
  return out.map(function(l){ return l.slice(0,w); });
}
function PdfDoc(){
  var W = 595, H = 842, MX = 36, MT = 42, MB = 44, pages = [], cur = null, y = 0;
  function newPage(){ cur = []; pages.push(cur); y = H - MT; }
  newPage();
  return {
    line:function(str, font, size, o){
      o = o || {};
      var lh = size * (o.lh || 1.3);
      if(y - lh < MB) newPage();
      y -= lh;
      cur.push('BT /' + font + ' ' + size + ' Tf ' + (MX + (o.x||0)) + ' ' + y.toFixed(1) + ' Td (' + pdfEsc(pdfSafe(str)) + ') Tj ET');
    },
    gap:function(n){ y -= n; },
    ensure:function(h){ if(y - h < MB) newPage(); },
    pageBreak:function(){ newPage(); },
    rule:function(){
      if(y - 8 < MB) newPage();
      y -= 4; cur.push('0.6 w ' + MX + ' ' + y.toFixed(1) + ' m ' + (W-MX) + ' ' + y.toFixed(1) + ' l S'); y -= 4;
    },
    build:function(){
      var objs = [];
      objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      objs[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>';
      objs[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>';
      var kids = [];
      pages.forEach(function(pg, idx){
        var pid = 7 + idx*2, cid = pid + 1;
        kids.push(pid + ' 0 R');
        var footer = 'BT /F1 8 Tf ' + MX + ' 24 Td (Cricket Scorer) Tj ET\nBT /F1 8 Tf ' + (W-MX-60) + ' 24 Td (Page ' + (idx+1) + ' of ' + pages.length + ') Tj ET';
        var stream = pg.join('\n') + '\n' + footer;
        objs[pid] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ' + cid + ' 0 R >>';
        objs[cid] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
      });
      objs[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
      var out = '%PDF-1.4\n', offs = [], k;
      for(k=1;k<objs.length;k++){ offs[k] = out.length; out += k + ' 0 obj\n' + objs[k] + '\nendobj\n'; }
      var xr = out.length;
      out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
      for(k=1;k<objs.length;k++){ out += ('0000000000' + offs[k]).slice(-10) + ' 00000 n \n'; }
      out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
      var u = new Uint8Array(out.length);
      for(k=0;k<out.length;k++) u[k] = out.charCodeAt(k) & 255;
      return u;
    }
  };
}
function dateStr(){
  var d = new Date(), p = function(n){ return ('0' + n).slice(-2); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function groupLog(st){
  var groups = [], cur = null, pending = [];
  st.log.forEach(function(r){
    if(r.note){ pending.push(r); return; }
    var on = parseInt(r.over, 10);
    if(!cur || cur.over !== on){ cur = {over:on, bowler:r.bowler, rows:[], runs:0}; groups.push(cur); }
    pending.forEach(function(q){ cur.rows.push(q); }); pending = [];
    cur.rows.push(r); cur.runs += r.total;
  });
  if(pending.length){ if(!cur){ cur = {over:null, rows:[], runs:0}; groups.push(cur); } pending.forEach(function(q){ cur.rows.push(q); }); }
  return groups;
}
function buildPDF(){
  var S = M.setup, d = new PdfDoc();
  d.line(S.title || (S.a + ' v ' + S.b), 'F2', 18, {lh:1.4});
  if(S.title) d.line(S.a + ' v ' + S.b, 'F1', 12);
  d.line(S.overs + ' overs per innings. Report created ' + dateStr(), 'F1', 10);
  d.gap(6);
  var res = matchResult();
  d.line('Result: ' + (res || (M.inns.length ? 'Match not complete' : 'Not started')), 'F2', 12);
  d.gap(2);
  M.inns.forEach(function(inn, i){
    var st = replay(i);
    d.line(batTeam(i) + '   ' + st.score + '/' + st.wkts + '   (' + fmtOv(st.balls) + ' overs)', 'F1', 11);
  });
  ['a','b'].forEach(function(side){
    var r = squadRole(side), names = knownPlayers(side).slice();
    if(r.tw) names.push(r.tw);
    names = uniq(names);
    if(!names.length) return;
    d.ensure(44); d.gap(6); d.line(teamName(side) + ' squad', 'F2', 10);
    names.forEach(function(x){ d.line(padR(x + roleTag(x), 30) + ' ' + detailText(x), 'F3', 9); });
  });

  M.inns.forEach(function(inn, i){
    var st = replay(i), ex = st.extras, exT = ex.wd + ex.nb + ex.b + ex.lb;
    d.ensure(150); d.gap(8); d.rule();
    d.line(batTeam(i) + ' batting, innings ' + (i+1) + (i===1 ? '  (target ' + st.target + ')' : ''), 'F2', 13);
    d.gap(2);
    d.line(padR('Batter',22) + ' ' + padR('How out',34) + padL('R',4) + padL('B',5) + padL('4s',4) + padL('6s',4) + padL('SR',7), 'F4', 9);
    st.batters.forEach(function(b){
      d.line(padR(b.name + roleTag(b.name),22) + ' ' + padR(b.how,34) + padL(b.runs,4) + padL(b.balls,5) + padL(b.fours,4) + padL(b.sixes,4) + padL(b.balls ? (b.runs/b.balls*100).toFixed(1) : '-',7), 'F3', 9);
    });
    d.line(padR('Extras',22) + ' ' + padR('(b ' + ex.b + ', lb ' + ex.lb + ', w ' + ex.wd + ', nb ' + ex.nb + ')',34) + padL(exT,4), 'F3', 9);
    d.line(padR('Total',22) + ' ' + padR('(' + st.wkts + ' wkts, ' + fmtOv(st.balls) + ' ov' + (st.balls ? ', RR ' + (st.score/(st.balls/6)).toFixed(2) : '') + ')',34) + padL(st.score,4), 'F4', 9);
    if(st.fow.length){
      d.gap(6); d.line('Fall of wickets', 'F2', 10);
      wrapText(st.fow.map(function(f){ return f.n + '-' + f.score + ' (' + f.name + ', ' + f.over + ')'; }).join('   '), 96).forEach(function(l){ d.line(l, 'F3', 9); });
    }
    d.gap(6); d.line('Bowling: ' + bowlTeam(i), 'F2', 10);
    d.line(padR('Bowler',22) + padL('O',6) + padL('M',4) + padL('R',5) + padL('W',4) + padL('Econ',7) + padL('Wd',4) + padL('Nb',4), 'F4', 9);
    st.bowlers.forEach(function(b){
      d.line(padR(b.name + roleTag(b.name),22) + padL(fmtOv(b.balls),6) + padL(b.maidens,4) + padL(b.runs,5) + padL(b.wkts,4) + padL(b.balls ? (b.runs/(b.balls/6)).toFixed(2) : '-',7) + padL(b.wd,4) + padL(b.nb,4), 'F3', 9);
    });
    var parts = st.parts.slice();
    if(st.cur) parts.push(partOpen(st.cur, st.parts.length + 1));
    if(parts.length){
      d.gap(6); d.line('Partnerships', 'F2', 10);
      parts.forEach(function(p){
        wrapText(p.k + '. ' + partText(p) + (p.open ? ' (not out)' : ' (' + p.out + ')'), 92).forEach(function(l, q){ d.line((q ? '   ' : '') + l, 'F3', 9); });
      });
    }
  });

  M.inns.forEach(function(inn, i){
    var st = replay(i);
    d.pageBreak();
    d.line('Ball by ball: ' + batTeam(i) + ', innings ' + (i+1), 'F2', 14, {lh:1.5});
    d.line('Format: over.ball, bowler to striker, what happened, score after the ball', 'F1', 9);
    groupLog(st).forEach(function(g){
      if(g.over===null){ g.rows.forEach(function(r){ d.line('   ' + r.note, 'F3', 9); }); return; }
      d.ensure(44); d.gap(6);
      d.line('Over ' + (g.over+1) + ', ' + g.bowler + ': ' + g.runs + ' run' + (g.runs===1 ? '' : 's'), 'F2', 10);
      g.rows.forEach(function(r){
        if(r.note){ d.line('   ' + r.note, 'F3', 9); return; }
        var lines = wrapText(r.bowler + ' to ' + r.striker + ': ' + r.text, 78);
        lines.forEach(function(l, k){
          d.line(k===0 ? padR(r.over,5) + padR(l,79) + padL(r.score + '/' + r.wkts,8) : '     ' + l, 'F3', 9);
        });
      });
    });
  });
  return d.build();
}
function downloadPDF(){
  var S = M.setup;
  var name = ((S.title || (S.a + ' v ' + S.b)) + ' ' + dateStr()).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.pdf';
  try{
    var blob = new Blob([buildPDF()], {type:'application/pdf'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 5000);
    toast('PDF ready: ' + name);
  }catch(err){ console.error(err); toast('Could not create the PDF: ' + err.message); }
}

/* ------------------------------ events ------------------------------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t) return;
  if(t.closest('.overlay')) return;
  if(t.dataset.tab){ ui.tab = t.dataset.tab; render(); return; }
  if(t.dataset.inn!=null){ ui.cardInn = +t.dataset.inn; render(); return; }
  if(t.dataset.view){ ui.cardView = t.dataset.view; render(); return; }
  if(t.dataset.p != null){ playerAction(t.dataset.p); return; }
  if(t.dataset.a){ act(t.dataset.a); return; }
  if(t.dataset.m){ matchAction(t.dataset.m); return; }
  if(t.dataset.h){ homeAction(t.dataset.h, t.dataset.id, t.dataset.k); }
});
document.addEventListener('change', function(e){
  var k = e.target.dataset && e.target.dataset.s; if(!k) return;
  if(!isScorer()){ toast('Only the scorer can change match settings'); render(); return; }
  var S = M.setup, v = e.target.value, val;
  if(['overs','maxWkts','maxBowlerOvers'].indexOf(k) >= 0){
    var num = parseInt(v, 10); if(isNaN(num)) num = S[k];
    var lo = k==='maxBowlerOvers' ? 0 : 1, hi = k==='maxWkts' ? 10 : 100;
    val = Math.max(lo, Math.min(hi, num));
  } else val = v.trim() || (k==='a' ? 'Team A' : k==='b' ? 'Team B' : '');
  var obj = {}; obj[k] = val;
  LIVE.fb.update(dbRef('matches/' + LIVE.mid + '/setup'), obj).catch(writeError);
});
async function homeAction(a, id, k){
  if(ui.busy) return; ui.busy = true;
  try{
    if(a==='new') await createMatch();
    else if(a==='open') await openPrompt();
    else if(a==='recent'){ location.hash = '#m=' + id; route(); }
    else if(a==='retry'){ LIVE.error = ''; render(); await boot(); }
    else if(a==='teams'){ ui.lib = {screen:'teams', tid:''}; try{ await loadLib(true); }catch(err){ toast('Could not load teams: ' + ((err && err.message) || err)); } }
    else if(a==='tlist'){ ui.lib = {screen:'teams', tid:''}; }
    else if(a==='tback'){ ui.lib = {screen:'', tid:''}; }
    else if(a==='team'){ ui.lib = {screen:'team', tid:id}; }
    else if(a==='newteam') await libNewTeam();
    else if(a==='addplayers') await libAddPlayers();
    else if(a==='renameteam') await libRenameTeam();
    else if(a==='delteam') await libDeleteTeam();
    else if(a==='libedit') await libEditPlayer(k);
    else if(a==='libremove') await libRemovePlayer(k);
  } finally { ui.busy = false; render(); }
}
async function matchAction(a){
  if(ui.busy) return; ui.busy = true;
  try{
    if(a==='pdf') downloadPDF();
    else if(a==='text') await textBox('Scorecard text', buildText(), false);
    else if(a==='logtext') await textBox('Ball log', buildLogText(ui.cardInn), false);
    else if(a==='share') await shareLink();
    else if(a==='scorerlink') await shareScorerLink();
    else if(a==='lock') await offerLock();
    else if(a==='squada') await editSquad('a');
    else if(a==='squadb') await editSquad('b');
    else if(a==='split') await editSplit();
    else if(a==='home'){ location.hash = ''; route(); }
  } finally { ui.busy = false; render(); }
}
/* keep the screen awake while scoring (where the browser allows it) */
var wake = null;
async function keepAwake(){
  try{ if(navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', function(){ wake = null; }); } }catch(e){}
}
document.addEventListener('pointerdown', keepAwake, {once:true});
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && ui.tab==='score') keepAwake(); });
boot();
